name: Release

# Hito T: pushing a tag vX.Y.Z produces the FULL appliance artifact per
# architecture -- binary, VERSION, ARCH, scripts, systemd unit, example
# config -- via deploy/appliance/scripts/package.sh (reused as-is, not a
# second/reduced tarball format), a SHA256SUMS manifest, an Ed25519
# detached signature over that manifest (SHA256SUMS.sig), and a GitHub
# Release. Distribution stays on the existing GitHub Releases
# infrastructure -- no registry, no object storage, no CDN.
#
# Signing is FAIL CLOSED: if the OTA_SIGNING_KEY secret is not configured,
# the job fails before anything is published. There is no unsigned or
# checksum-only release path.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Require OTA signing key
        run: |
          if [ -z "${{ secrets.OTA_SIGNING_KEY }}" ]; then
            echo "::error::OTA_SIGNING_KEY secret is not configured -- refusing to publish an unsigned release."
            exit 1
          fi

      - name: Package full appliance artifacts (amd64 + arm64)
        run: ./deploy/appliance/scripts/package.sh "${GITHUB_REF_NAME}" dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Sign SHA256SUMS (Ed25519, fail closed)
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$OTA_SIGNING_KEY" > "$key_file"
          go run ./cmd/geocam-edge ota sign \
            -sha256sums dist/SHA256SUMS \
            -private-key "$key_file" \
            -out dist/SHA256SUMS.sig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          generate_release_notes: true
