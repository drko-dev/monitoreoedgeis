name: Release

# Hito P: pushing a tag vX.Y.Z produces linux/amd64 + linux/arm64 binaries,
# a tar.gz per architecture, a SHA256SUMS manifest, and a GitHub Release.
# Reuses the existing `make build-linux` recipe (reproducible build: version,
# commit, build date, -trimpath, identical flags for both architectures) --
# no new build system. No signing (Hito S/T), no SBOM, no registry push.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Build linux/amd64 and linux/arm64
        run: |
          make build-linux \
            VERSION="${GITHUB_REF_NAME}" \
            COMMIT="$(git rev-parse --short HEAD)" \
            BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Package per-architecture tarballs
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            stage="geocam-edge-${GITHUB_REF_NAME}-linux-${arch}"
            mkdir -p "dist/${stage}"
            cp "bin/geocam-edge-linux-${arch}" "dist/${stage}/geocam-edge"
            tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
            rm -rf "dist/${stage}"
          done

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
