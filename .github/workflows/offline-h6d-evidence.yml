name: H6D source PGP, wheel evidence and release preflight

on:
  pull_request:
    paths:
      - 'deploy/installer/audit-wheelhouse-evidence.py'
      - 'deploy/installer/test-audit-wheelhouse-evidence.py'
      - 'deploy/installer/audit-ffmpeg-build-chain.py'
      - 'deploy/installer/test-audit-ffmpeg-build-chain.py'
      - 'deploy/installer/verify-ffmpeg-source-pgp.py'
      - 'deploy/installer/test-verify-ffmpeg-source-pgp.py'
      - 'deploy/installer/check-runtime-pack-release.py'
      - 'deploy/installer/test-runtime-pack-release-preflight.py'
      - 'deploy/installer/runtime-pack-license-audit.py'
      - 'deploy/installer/test-runtime-pack-license-audit.py'
      - '.github/workflows/offline-h6d-evidence.yml'
      - 'docs/architecture/OFFLINE_H6D_LICENSE_AUDIT.md'
      - 'docs/architecture/OFFLINE_H6D_R8_BUILD_CHAIN_AUDIT.md'
      - 'docs/architecture/OFFLINE_H6D_R7_FFMPEG_SOURCE_AUTHENTICITY.md'
  push:
    branches: [main]
    paths:
      - 'deploy/installer/audit-wheelhouse-evidence.py'
      - 'deploy/installer/test-audit-wheelhouse-evidence.py'
      - 'deploy/installer/audit-ffmpeg-build-chain.py'
      - 'deploy/installer/test-audit-ffmpeg-build-chain.py'
      - 'deploy/installer/verify-ffmpeg-source-pgp.py'
      - 'deploy/installer/test-verify-ffmpeg-source-pgp.py'
      - 'deploy/installer/check-runtime-pack-release.py'
      - 'deploy/installer/test-runtime-pack-release-preflight.py'
      - '.github/workflows/offline-h6d-evidence.yml'

permissions:
  contents: read

jobs:
  synthetic-integrity:
    name: Synthetic read-only audit and fail-closed preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic tests without downloading models, wheels or FFmpeg
        env:
          PIP_NO_INDEX: '1'
          GOPROXY: 'off'
          HF_HUB_OFFLINE: '1'
        run: |
          python3 deploy/installer/test-audit-wheelhouse-evidence.py
          python3 deploy/installer/test-runtime-pack-release-preflight.py
          python3 deploy/installer/test-audit-ffmpeg-build-chain.py
          python3 deploy/installer/test-runtime-pack-license-audit.py

# CI uses tiny synthetic wheels. Real 36-wheel inspection is owner-local only;
# even passing these checks does not authenticate origin or grant legal rights.


  pgp-synthetic:
    name: Synthetic FFmpeg PGP signature verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require GnuPG verifier
        run: command -v gpg && gpg --version | head -1
      - name: Verify synthetic PGP and adversarial failures without downloads
        env:
          PIP_NO_INDEX: '1'
        run: python3 deploy/installer/test-verify-ffmpeg-source-pgp.py

# Production FFmpeg tarballs, signing keys and binary artifacts are NOT shipped
# into CI by this workflow. Real source authentication was observed on Mac M4.
