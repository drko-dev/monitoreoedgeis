name: Installer Release

# UX-7: produces official Wails desktop installer GUI artifacts for
# Windows amd64, Linux amd64, Linux arm64, and macOS arm64, on a tag push.
# This is deliberately separate from release.yml (which builds the Linux
# daemon/appliance artifact) -- the installer GUI has its own build
# (Wails/CGO/webview toolchain per platform) and its own signing story.
#
# Native runners are used wherever the toolchain needs them: Wails/CGO
# builds are not reliably cross-compilable, so a Go cross-compile producing
# a bare ELF/PE is not accepted as a validated platform artifact here.
#
# Signing is FAIL CLOSED per platform: if that platform's signing secret is
# not configured, its signing step fails explicitly rather than silently
# publishing an unsigned "official" artifact. The build itself still runs
# and its artifact is still attached, labeled unsigned, so the pipeline is
# testable before any signing secret exists.
on:
  push:
    tags:
      - 'installer-v*.*.*'

permissions:
  contents: write

env:
  WAILS_VERSION: v2.16.0

jobs:
  build-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Wails app (windows/amd64)
        working-directory: cmd/geocam-edge-ui
        run: go run github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }} build -platform windows/amd64
      - name: Checksum
        shell: bash
        working-directory: cmd/geocam-edge-ui/build/bin
        run: sha256sum * > SHA256SUMS-windows-amd64.txt || certutil -hashfile geocam-edge-ui.exe SHA256 > SHA256SUMS-windows-amd64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-amd64-unsigned
          path: cmd/geocam-edge-ui/build/bin/*

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Linux GUI toolchain (gtk3/webkit2gtk)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build Wails app (linux/amd64)
        working-directory: cmd/geocam-edge-ui
        run: go run github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }} build -platform linux/amd64
      - name: Checksum and integrity metadata
        working-directory: cmd/geocam-edge-ui/build/bin
        run: sha256sum * > SHA256SUMS-linux-amd64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-amd64
          path: cmd/geocam-edge-ui/build/bin/*

  build-linux-arm64:
    # Native ARM64 runner: Wails/CGO/webview cross-compilation from amd64 is
    # not reliable enough to validate a real GUI artifact against.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Linux GUI toolchain (gtk3/webkit2gtk)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build Wails app (linux/arm64, native)
        working-directory: cmd/geocam-edge-ui
        run: go run github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }} build -platform linux/arm64
      - name: Checksum and integrity metadata
        working-directory: cmd/geocam-edge-ui/build/bin
        run: sha256sum * > SHA256SUMS-linux-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-arm64
          path: cmd/geocam-edge-ui/build/bin/*

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Wails app (darwin/arm64)
        working-directory: cmd/geocam-edge-ui
        run: go run github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }} build -platform darwin/arm64
      - name: Checksum
        working-directory: cmd/geocam-edge-ui/build/bin
        run: shasum -a 256 geocam-edge-ui.app/Contents/MacOS/geocam-edge-ui > SHA256SUMS-macos-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-arm64-unsigned
          path: cmd/geocam-edge-ui/build/bin/*

  sign-windows:
    needs: build-windows-amd64
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer-windows-amd64-unsigned
          path: artifact
      - name: Require Windows signing certificate
        shell: bash
        run: |
          if [ -z "${{ secrets.WINDOWS_SIGNING_CERT }}" ] || [ -z "${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}" ]; then
            echo "::error::WINDOWS_SIGNING_CERT/WINDOWS_SIGNING_CERT_PASSWORD not configured -- refusing to mark this artifact as officially signed. The unsigned build artifact remains available from build-windows-amd64 for testing."
            exit 1
          fi
      - name: Sign (placeholder -- fill in with real signtool invocation once the cert secret exists)
        shell: bash
        run: |
          echo "::error::Signing step not implemented -- WINDOWS_SIGNING_CERT is configured but no signing tool invocation exists yet. Do not mark UX7_SIGNING as PASS from this step alone."
          exit 1

  sign-macos:
    needs: build-macos-arm64
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer-macos-arm64-unsigned
          path: artifact
      - name: Require macOS signing/notarization credentials
        run: |
          if [ -z "${{ secrets.APPLE_SIGNING_CERT }}" ] || [ -z "${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}" ]; then
            echo "::error::APPLE_SIGNING_CERT/APPLE_NOTARIZATION_APPLE_ID not configured -- refusing to mark this artifact as officially signed/notarized. The unsigned build artifact remains available from build-macos-arm64 for testing."
            exit 1
          fi
      - name: Sign and notarize (placeholder -- fill in with real codesign/notarytool invocation once the cert secret exists)
        run: |
          echo "::error::Signing/notarization step not implemented -- APPLE_SIGNING_CERT is configured but no codesign/notarytool invocation exists yet. Do not mark UX7_SIGNING as PASS from this step alone."
          exit 1

  publish:
    needs: [build-windows-amd64, build-linux-amd64, build-linux-arm64, build-macos-arm64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release (unsigned test artifacts unless signing jobs above succeeded)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          prerelease: true
