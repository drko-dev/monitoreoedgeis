name: Installer Release

# Publishes "GEO CAM Edge vX.Y.Z — Release Stable": the Wails desktop
# installer GUI for Windows amd64, macOS arm64, Linux amd64 and Linux arm64,
# on an `installer-vX.Y.Z` tag push only. Deliberately separate from
# release.yml (the Linux daemon/appliance + OTA artifact, `vX.Y.Z` tags,
# Ed25519-signed) -- this workflow never touches OTA, the appliance, the SaaS
# or any installed device; it only builds and publishes files.
#
# Builds are NOT code-signed (no Windows certificate, no Apple Developer ID,
# no notarization); integrity is provided by SHA256SUMS.txt.
#
# Fail closed: `publish` needs the tag check, the test suite and all four
# platform builds, with no `if: always()`. Any failure means no release and
# the previous Latest release stays untouched. The release is created as a
# draft, its uploaded assets are re-downloaded and verified, and only then is
# it published and marked Latest. A re-run reuses a draft left by a failed
# run and refuses to touch a tag whose release is already published.
on:
  push:
    tags:
      - 'installer-v*.*.*'

permissions:
  contents: read

concurrency:
  group: installer-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse tag, require a commit on main, refuse an already published release
        id: tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^installer-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] \
            || { echo "::error::tag $TAG is not installer-vMAJOR.MINOR.PATCH"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG ($GITHUB_SHA) is not a commit on main"; exit 1; }
          published=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\" and (.draft | not)) | .html_url")
          [ -z "$published" ] || { echo "::error::$TAG is already published ($published); releases are never overwritten -- tag a new version"; exit 1; }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  test:
    # Same gates as the ci.yml build job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Install ffmpeg (required by internal/installer capability tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test
        run: go test ./...

  build:
    needs: verify-tag
    uses: ./.github/workflows/installer-build.yml
    with:
      version: ${{ needs.verify-tag.outputs.version }}

  publish:
    needs: [verify-tag, test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
      - name: Cross-check the four packages and write SHA256SUMS.txt
        run: ./deploy/installer/assemble-release.sh "$VERSION" "$GITHUB_SHA" artifacts dist

      - name: Write release notes
        run: |
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          cat > notes.md <<EOF
          GEO CAM Edge desktop installer **v$VERSION**, built from \`$GITHUB_SHA\`.

          | Platform | Download |
          |---|---|
          | Windows 10/11 (x64) | [geocam-edge-installer-windows-amd64.exe]($base/geocam-edge-installer-windows-amd64.exe) |
          | macOS (Apple Silicon) | [geocam-edge-installer-macos-arm64.zip]($base/geocam-edge-installer-macos-arm64.zip) |
          | Linux x86-64 | [geocam-edge-installer-linux-amd64.tar.gz]($base/geocam-edge-installer-linux-amd64.tar.gz) |
          | Linux ARM64 | [geocam-edge-installer-linux-arm64.tar.gz]($base/geocam-edge-installer-linux-arm64.tar.gz) |

          Verify a download: \`sha256sum -c --ignore-missing SHA256SUMS.txt\` (macOS: \`shasum -a 256 -c --ignore-missing SHA256SUMS.txt\`).

          These builds are **not code-signed**. Windows SmartScreen may show "Windows protected your PC" (More info → Run anyway) and macOS may say the app cannot be verified (System Settings → Privacy & Security → Open Anyway). Verify the SHA-256 first.

          This is the desktop installer only. The Linux appliance/OTA package is released separately under \`vX.Y.Z\` tags.
          EOF

      - name: Create or resume the draft release and upload assets
        run: |
          set -euo pipefail
          title="GEO CAM Edge v$VERSION — Release Stable"
          states=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .draft")
          if grep -qx false <<<"$states"; then echo "::error::$TAG is already published; refusing to modify it"; exit 1; fi
          drafts=$(grep -cx true <<<"$states" || true)
          case "$drafts" in
            0) gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file notes.md dist/* ;;
            1) echo "Resuming the draft left by a previous failed run"
               gh release edit "$TAG" --title "$title" --notes-file notes.md
               gh release upload "$TAG" dist/* --clobber ;;
            *) echo "::error::$drafts draft releases exist for $TAG; resolve manually"; exit 1 ;;
          esac

      - name: Verify the uploaded assets before publishing
        run: |
          set -euo pipefail
          expected=$(cd dist && ls | sort)
          actual=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          [ "$expected" = "$actual" ] || { echo "::error::release assets differ from the build:"; diff <(echo "$expected") <(echo "$actual"); exit 1; }
          gh release download "$TAG" --dir check
          (cd check && sha256sum -c SHA256SUMS.txt)
          cmp dist/SHA256SUMS.txt check/SHA256SUMS.txt

      - name: Publish and mark as Latest
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          [ "$latest" = "$TAG" ] || { echo "::error::Latest is $latest, expected $TAG"; exit 1; }
          echo "Published: https://github.com/$GH_REPO/releases/tag/$TAG"
