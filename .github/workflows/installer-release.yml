name: Installer Release

# UX-7: OFFICIAL release of the Wails desktop installer GUI, for
# Windows amd64, Linux amd64, Linux arm64, and macOS arm64, on an
# `installer-v*.*.*` tag push only. Deliberately separate from
# release.yml (the Linux daemon/appliance artifact) and from
# installer-build-validation.yml (unsigned, non-publishing CI builds).
#
# Fail-closed by construction: `publish` depends on every build job AND
# both signing jobs, with no `if: always()`. If Windows or macOS signing
# is not configured or fails for any reason, `publish` never runs and no
# GitHub Release is created -- there is no path that ends in an unsigned
# Windows/macOS binary being attached to an official release. Linux
# artifacts ship with a SHA256SUMS integrity manifest (no code-signing
# convention exists for them here).
on:
  push:
    tags:
      - 'installer-v*.*.*'

permissions:
  contents: write

env:
  WAILS_VERSION: v2.16.0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Wails app (windows/amd64)
        working-directory: cmd/geocam-edge-ui
        run: go run github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }} build -platform windows/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-amd64-unsigned
          path: cmd/geocam-edge-ui/build/bin/*
          retention-days: 7

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Linux GUI toolchain (gtk3/webkit2gtk)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build Wails app (linux/amd64)
        working-directory: cmd/geocam-edge-ui
        run: go run github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }} build -platform linux/amd64 -tags webkit2_41
      - name: Checksum
        working-directory: cmd/geocam-edge-ui/build/bin
        run: sha256sum * > SHA256SUMS-linux-amd64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-amd64
          path: cmd/geocam-edge-ui/build/bin/*
          retention-days: 7

  build-linux-arm64:
    # Native ARM64 runner: Wails/CGO/webview cross-compilation from amd64 is
    # not reliable enough to trust as a validated GUI artifact.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Linux GUI toolchain (gtk3/webkit2gtk)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build Wails app (linux/arm64, native)
        working-directory: cmd/geocam-edge-ui
        run: go run github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }} build -platform linux/arm64 -tags webkit2_41
      - name: Checksum
        working-directory: cmd/geocam-edge-ui/build/bin
        run: sha256sum * > SHA256SUMS-linux-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-arm64
          path: cmd/geocam-edge-ui/build/bin/*
          retention-days: 7

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Wails app (darwin/arm64)
        working-directory: cmd/geocam-edge-ui
        run: go run github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }} build -platform darwin/arm64
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-arm64-unsigned
          path: cmd/geocam-edge-ui/build/bin/*
          retention-days: 7

  sign-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Require Windows signing secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}" ] || [ -z "${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}" ]; then
            echo "::error::WINDOWS_SIGNING_CERT_BASE64/WINDOWS_SIGNING_CERT_PASSWORD not configured -- refusing to sign or publish an official Windows release."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: installer-windows-amd64-unsigned
          path: artifact
      - name: Decode certificate to a temporary file
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'signing-cert.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV
      - name: Locate signtool.exe
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found on this runner image."; exit 1 }
          echo "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
      - name: Sign the installer executable
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $exe = Get-ChildItem -Path artifact -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "No .exe artifact found to sign."; exit 1 }
          & $env:SIGNTOOL_PATH sign /f "$env:CERT_PATH" /p "$env:WINDOWS_SIGNING_CERT_PASSWORD" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$($exe.FullName)"
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign failed."; exit 1 }
      - name: Verify the signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path artifact -Recurse -Filter *.exe | Select-Object -First 1
          & $env:SIGNTOOL_PATH verify /pa /v "$($exe.FullName)"
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool verify failed on the signed artifact."; exit 1 }
      - name: Remove the certificate material
        if: always()
        shell: pwsh
        run: |
          if ($env:CERT_PATH -and (Test-Path $env:CERT_PATH)) { Remove-Item -Force $env:CERT_PATH }
      - name: Checksum the signed artifact
        shell: bash
        working-directory: artifact
        run: sha256sum * > SHA256SUMS-windows-amd64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-amd64-signed
          path: artifact/*
          retention-days: 7

  sign-macos:
    needs: build-macos
    runs-on: macos-14
    steps:
      - name: Require Apple signing and notarization secrets
        run: |
          missing=0
          for v in APPLE_SIGNING_CERT_BASE64 APPLE_SIGNING_CERT_PASSWORD APPLE_SIGNING_IDENTITY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v not configured."; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Apple signing/notarization secrets incomplete -- refusing to sign, notarize, or publish an official macOS release."
            exit 1
          fi
        env:
          APPLE_SIGNING_CERT_BASE64: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: installer-macos-arm64-unsigned
          path: artifact
      - name: Create a temporary keychain and import the signing certificate
        env:
          APPLE_SIGNING_CERT_BASE64: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/signing-cert.p12"
          echo -n "$APPLE_SIGNING_CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_SIGNING_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Codesign the app bundle (hardened runtime)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP_PATH="$(find artifact -maxdepth 2 -iname '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then echo "::error::No .app bundle found to sign."; exit 1; fi
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
      - name: Notarize (App Store Connect API key)
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          echo -n "$APPLE_NOTARY_PRIVATE_KEY" > "$KEY_PATH"
          ZIP_PATH="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH" \
            --key "$KEY_PATH" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          rm -f "$KEY_PATH" "$ZIP_PATH"
      - name: Destroy the temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
      - name: Checksum the signed, notarized artifact
        run: |
          cd artifact
          shasum -a 256 "$(find . -maxdepth 2 -iname '*.app' -exec basename {} \; | head -1)/Contents/MacOS/geocam-edge-ui" > SHA256SUMS-macos-arm64.txt || true
          find . -maxdepth 2 -iname '*.app' -print0 | xargs -0 -I{} shasum -a 256 -r {} >> SHA256SUMS-macos-arm64.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-arm64-signed
          path: artifact/*
          retention-days: 7

  publish:
    # Fail-closed: every platform must build AND every signable platform
    # must sign successfully. No if: always() -- if any dependency fails or
    # is skipped, this job (and therefore the GitHub Release) never runs.
    needs:
      - build-windows
      - build-linux-amd64
      - build-linux-arm64
      - build-macos
      - sign-windows
      - sign-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'installer-*'
          path: dist
          merge-multiple: false
      - name: Refuse to publish any leftover *-unsigned artifact
        run: |
          if find dist -maxdepth 1 -iname '*-unsigned' | grep -q .; then
            echo "::error::An unsigned artifact directory is present at publish time -- refusing to publish."
            exit 1
          fi
      - name: Create official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
