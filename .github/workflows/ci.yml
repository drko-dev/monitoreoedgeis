name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/geocam-edge

      - name: Cross-build deployment targets
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/geocam-edge
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/geocam-edge
