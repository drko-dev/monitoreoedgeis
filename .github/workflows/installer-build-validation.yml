name: Installer Build Validation

# Runs the exact release build (installer-build.yml) and release assembly
# checks on every pull request, stamped as version 0.0.<run number>, so a broken
# platform, package or checksum is caught before anything is tagged. It never
# creates a GitHub Release and needs no secrets. The packages are kept as
# workflow artifacts for 7 days for manual inspection.
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/installer-build.yml
    with:
      version: 0.0.${{ github.run_number }}

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
      - name: Cross-check the four packages and write SHA256SUMS.txt
        run: ./deploy/installer/assemble-release.sh "0.0.${{ github.run_number }}" "${{ github.sha }}" artifacts dist
