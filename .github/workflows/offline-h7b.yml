name: H7B outbound-IP isolation lab checks

on:
  pull_request:
    paths:
      - 'deploy/installer/h7b-egress-cert.py'
      - 'deploy/installer/mac-h7b-loopback-egress.sb'
      - 'deploy/installer/test-h7b-egress-cert.py'
      - '.github/workflows/offline-h7b.yml'
      - 'docs/testing/OFFLINE_H7B_EGRESS_LAB.md'
  push:
    branches: [main]
    paths:
      - 'deploy/installer/h7b-egress-cert.py'
      - 'deploy/installer/mac-h7b-loopback-egress.sb'
      - 'deploy/installer/test-h7b-egress-cert.py'
      - '.github/workflows/offline-h7b.yml'
      - 'docs/testing/OFFLINE_H7B_EGRESS_LAB.md'

permissions:
  contents: read

jobs:
  syntax-and-fail-closed:
    name: Synthetic sandbox policy unit tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify policy syntax contract (no network probes)
        run: python3 deploy/installer/test-h7b-egress-cert.py

  macos-boundary:
    name: macOS localhost/TCP/UDP process-tree boundary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual sandbox denial with ephemeral loopback
        run: |
          python3 deploy/installer/h7b-egress-cert.py > "$RUNNER_TEMP/h7b-boundary.json"
          python3 - "$RUNNER_TEMP/h7b-boundary.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report["status"] == "BOUNDARY_PROBE_PASS_NOT_AIRGAP_CERTIFIED"
          assert report["boundary"]["child"]["grandchild_policy_inherited"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: offline-h7b-macos-boundary
          path: ${{ runner.temp }}/h7b-boundary.json
          if-no-files-found: error

# This CI does not load models or certify a release Runtime Pack.
# The real Mac M4 FFmpeg/YOLO E2E remains an explicit separate lab test.
