replicaCount: 1

image:
  repository: geocam-edge
  tag: dev
  # The image is built locally into containerd (k8s.io namespace) with nerdctl,
  # so it must never be pulled from a registry.
  pullPolicy: Never

# Agent configuration, rendered into a ConfigMap and consumed as env vars.
config:
  # One of: cloud, hybrid, edge.
  processingMode: cloud
  logLevel: info
  # Base URL of the SaaS. Leave empty to run the agent fully offline: the
  # heartbeat module is then not registered at all, rather than started and
  # left failing.
  saasUrl: ""
  # Interval between heartbeats. Must be within 5s-5m inclusive; anything
  # outside that band is a startup error, not a clamped value.
  heartbeatInterval: 30s
  dataDir: /var/lib/geocam-edge
  # Empty edgeId => the agent reads/creates its persistent identity.json
  # under dataDir instead. Only set this to force a dev override.
  edgeId: ""
  # Bind 0.0.0.0 here (not 127.0.0.1) so kubelet can reach the probes
  # across the pod network namespace.
  healthAddr: "0.0.0.0:8091"

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Persists identity.json (and future local state) across pod recreation.
persistence:
  enabled: true
  size: 128Mi
  storageClassName: local-path

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
